<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Resume Rewriter &amp; ATS Optimizer</title>

<!-- Loads our modular stylesheet from the Flask static folder -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3"/>
</head>
<body>

  <header class="app-header">
    <h1>AI Resume Rewriter &amp; ATS Optimizer</h1>
    <p class="subtitle">Upload your resume, paste a target job description, and get an ATS-optimized rewrite.</p>
  </header>

  <main class="layout">

    <!-- ===================== LEFT COLUMN: INPUT FORM ===================== -->
    <section class="panel input-panel">
      <h2>1. Your Inputs</h2>

      <form id="rewrite-form">

        <label for="resume-input">Resume (PDF only)</label>
        <input
          type="file"
          id="resume-input"
          name="resume"
          accept="application/pdf"
          required
        />
        <!-- Shows the selected filename so the user gets feedback immediately -->
        <p id="file-name-display" class="hint">No file selected.</p>

        <label for="job-description-input">Target Job Description</label>
        <textarea
          id="job-description-input"
          name="job_description"
          rows="14"
          placeholder="Paste the full job description here..."
          required
        ></textarea>

        <button type="submit" id="submit-btn">Rewrite Resume</button>
      </form>

      <!-- Error box, hidden by default, shown by JS on failure -->
      <div id="error-box" class="error-box hidden" role="alert"></div>
    </section>

    <!-- ===================== RIGHT COLUMN: OUTPUT DISPLAY ===================== -->
    <section class="panel output-panel">
      <h2>2. Optimized Result</h2>

      <!-- Placeholder shown before the first request -->
      <div id="placeholder-state" class="placeholder">
        Your rewritten, ATS-optimized resume will appear here.
      </div>

      <!-- Loading state shown while waiting on the backend -->
      <div id="loading-state" class="loading hidden">
        <div class="spinner"></div>
        <p>Analyzing resume against job description...</p>
      </div>

      <!-- Final rendered output -->
      <article id="result-output" class="result-output hidden"></article>

      <button id="copy-btn" class="copy-btn hidden" type="button">Copy to Clipboard</button>
    </section>

  </main>

  <script src="{{ url_for('static', filename='script.js') }}?v=1"></script>

</body>
</html>
